<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 44 760 520" role="img" aria-label="Architecture générale du projet" font-size="13" font-family="Inter, Arial, sans-serif"><defs><marker id="archi-fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1b1b1b"></path></marker></defs><rect x="24" y="54" width="330" height="72" fill="none" stroke="#1b1b1b" stroke-width="1.5"></rect><text x="40" y="78" font-weight="600" fill="#1b1b1b">Tâche 4 : supervision domotique</text><text x="40" y="96" font-size="12" fill="#1b1b1b">Logiciel de type Home Assistant</text><text x="40" y="112" font-size="12" fill="#1b1b1b">Historique, alertes par mail et téléphone</text><rect x="406" y="54" width="330" height="72" fill="none" stroke="#1b1b1b" stroke-width="1.5"></rect><text x="422" y="78" font-weight="600" fill="#1b1b1b">Tâche 6 : supervision kart et énergie</text><text x="422" y="96" font-size="12" fill="#1b1b1b">Kart, borne et installation solaire</text><text x="422" y="112" font-size="12" fill="#1b1b1b">Position GPS, choix du mode de conduite</text><g fill="none" stroke="#1b1b1b" stroke-width="1"><path d="M189 182V126" marker-start="url(#archi-fl)" marker-end="url(#archi-fl)"></path><path d="M571 182V126" marker-start="url(#archi-fl)" marker-end="url(#archi-fl)"></path><path d="M571 270V294" marker-end="url(#archi-fl)"></path><path d="M571 350V374" marker-end="url(#archi-fl)"></path></g><text x="199" y="158" font-size="12" font-style="italic" fill="#1b1b1b">Zigbee ou Wi-Fi</text><text x="581" y="158" font-size="12" font-style="italic" fill="#1b1b1b">Wi-Fi ou câble</text><text x="581" y="286" font-size="12" font-style="italic" fill="#1b1b1b">230 V alternatif</text><text x="581" y="366" font-size="12" font-style="italic" fill="#1b1b1b">câble de recharge</text><rect x="24" y="182" width="330" height="368" fill="none" stroke="#1b1b1b" stroke-width="1" stroke-dasharray="5 4"></rect><text x="40" y="204" font-weight="600" fill="#1b1b1b">Domotique du département</text><rect x="40" y="214" width="298" height="56" fill="none" stroke="#1b1b1b" stroke-width="1"></rect><text x="52" y="238" fill="#1b1b1b">Tâche 1 : arrosage des plantes</text><text x="52" y="256" font-size="12" fill="#1b1b1b">Humidité de la terre, arrosage, réservoir</text><rect x="40" y="294" width="298" height="56" fill="none" stroke="#1b1b1b" stroke-width="1"></rect><text x="52" y="318" fill="#1b1b1b">Tâche 2 : salle d&#x27;impression 3D</text><text x="52" y="336" font-size="12" fill="#1b1b1b">Badge, température, humidité, présence</text><rect x="40" y="374" width="298" height="56" fill="none" stroke="#1b1b1b" stroke-width="1"></rect><text x="52" y="398" fill="#1b1b1b">Tâche 3 : local serveur LTG</text><text x="52" y="416" font-size="12" fill="#1b1b1b">Clim, ventilation de la baie, alertes</text><rect x="40" y="454" width="298" height="56" fill="none" stroke="#1b1b1b" stroke-width="1"></rect><text x="52" y="478" fill="#1b1b1b">Tâche 4 : éclairage de nuit</text><text x="52" y="496" font-size="12" fill="#1b1b1b">Présence, luminosité, horaire</text><rect x="406" y="182" width="330" height="368" fill="none" stroke="#1b1b1b" stroke-width="1" stroke-dasharray="5 4"></rect><text x="422" y="204" font-weight="600" fill="#1b1b1b">Kart et énergie</text><rect x="422" y="214" width="298" height="56" fill="none" stroke="#1b1b1b" stroke-width="1"></rect><text x="434" y="238" fill="#1b1b1b">Tâche 9 : solaire et stockage</text><text x="434" y="256" font-size="12" fill="#1b1b1b">Panneaux, batterie de stockage, base Victron</text><rect x="422" y="294" width="298" height="56" fill="none" stroke="#1b1b1b" stroke-width="1"></rect><text x="434" y="318" fill="#1b1b1b">Tâche 8 : borne de recharge</text><text x="434" y="336" font-size="12" fill="#1b1b1b">Dialogue avec le kart, outil de test</text><rect x="422" y="374" width="298" height="160" fill="none" stroke="#1b1b1b" stroke-width="1"></rect><text x="438" y="396" font-weight="600" fill="#1b1b1b">Kart électrique (bus interne)</text><rect x="438" y="406" width="266" height="32" fill="none" stroke="#1b1b1b" stroke-width="1"></rect><text x="450" y="426" fill="#1b1b1b">Tâche 5 : variateur</text><rect x="438" y="446" width="266" height="32" fill="none" stroke="#1b1b1b" stroke-width="1"></rect><text x="450" y="466" fill="#1b1b1b">Tâche 6 : tableau de bord, GPS</text><rect x="438" y="486" width="266" height="32" fill="none" stroke="#1b1b1b" stroke-width="1"></rect><text x="450" y="506" fill="#1b1b1b">Tâche 7 : conduite autonome</text></svg>