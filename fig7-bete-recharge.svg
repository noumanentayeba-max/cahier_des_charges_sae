<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 8 760 276" role="img" aria-label="Bête à cornes de la recharge solaire" font-size="13" font-family="Inter, Arial, sans-serif"><defs><marker id="b7-fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1b1b1b"></path></marker></defs><text x="40" y="28" font-size="12" font-style="italic" fill="#1b1b1b">À qui rend-il service ?</text><text x="480" y="28" font-size="12" font-style="italic" fill="#1b1b1b">Sur quoi agit-il ?</text><rect x="40" y="38" width="240" height="56" fill="none" stroke="#1b1b1b" stroke-width="1"></rect><text x="160" y="61" text-anchor="middle" fill="#1b1b1b">À l&#x27;utilisateur du kart</text><text x="160" y="79" text-anchor="middle" fill="#1b1b1b">(pilote ou opérateur)</text><rect x="480" y="38" width="240" height="56" fill="none" stroke="#1b1b1b" stroke-width="1"></rect><text x="600" y="61" text-anchor="middle" fill="#1b1b1b">Sur la batterie du kart,</text><text x="600" y="79" text-anchor="middle" fill="#1b1b1b">à partir de l&#x27;énergie solaire</text><g fill="none" stroke="#1b1b1b" stroke-width="1"><path d="M160 94 Q160 150 260 150"></path><path d="M500 150 Q600 150 600 94"></path><path d="M380 180 V216" marker-end="url(#b7-fl)"></path></g><ellipse cx="380" cy="150" rx="120" ry="30" fill="none" stroke="#1b1b1b" stroke-width="1.5"></ellipse><text x="380" y="155" text-anchor="middle" font-size="14" font-weight="600" fill="#1b1b1b">Borne de recharge solaire</text><text x="140" y="208" font-size="12" font-style="italic" fill="#1b1b1b">Dans quel but ?</text><rect x="140" y="216" width="480" height="56" fill="none" stroke="#1b1b1b" stroke-width="1"></rect><text x="380" y="239" text-anchor="middle" fill="#1b1b1b">Recharger le kart en toute sécurité,</text><text x="380" y="257" text-anchor="middle" fill="#1b1b1b">avec le plus possible d&#x27;énergie solaire</text></svg>